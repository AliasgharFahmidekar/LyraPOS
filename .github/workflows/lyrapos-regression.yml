name: LyraPOS Regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lyrapos-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Original test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Start virtual display for Electron renderer tests
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -ac +extension GLX +render -noreset > /tmp/lyrapos-xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for attempt in {1..20}; do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/lyrapos-xvfb.log
          exit 1

      - name: Run original test suite unchanged
        run: npm test
