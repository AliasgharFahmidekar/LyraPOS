name: LyraPOS Windows Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a stable GitHub Release (only from main); otherwise build an Actions artifact"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lyrapos-windows-release.yml'
      - '.github/workflows/lyrapos-windows.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/assert-release-artifact-names.cjs'
      - 'tests/release-config.test.ts'
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: lyrapos-windows-release
  cancel-in-progress: false

jobs:
  build-windows-release:
    name: Build LyraPOS Windows
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-mode.outputs.version }}
      publish: ${{ steps.release-mode.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run release:win

      - name: Verify release artifact names
        run: npm run verify:release-artifacts

      - name: Run Windows packaging identity guard
        run: npm run test:windows-packaging-identity

      - name: Validate release mode and version
        id: release-mode
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (node -p "require('./package.json').version").Trim()
          if ($version -notmatch '^\\d+\\.\\d+\\.\\d+$') {
            throw "Windows stable release requires X.Y.Z package version; found '$version'."
          }

          $publish = $false
          if ($env:EVENT_NAME -eq 'push') {
            if ($env:REF_TYPE -ne 'tag' -or $env:REF_NAME -ne $version) {
              throw "Pushed tag '$($env:REF_NAME)' must exactly match package.json version '$version'."
            }
            git fetch origin main --quiet
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main for release provenance validation.' }
            git merge-base --is-ancestor $env:COMMIT_SHA origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Refusing to release a tag whose commit is not in main history.' }
            $publish = $true
          } elseif ($env:PUBLISH_RELEASE -eq 'true') {
            if ($env:REF -ne 'refs/heads/main') {
              throw 'Publishing from a workflow_dispatch run is allowed only from main. PR-branch runs are build-only.'
            }
            $remoteTag = git ls-remote --tags origin "refs/tags/$version"
            if ($LASTEXITCODE -ne 0) { throw 'Could not check whether the release tag already exists.' }
            if ($remoteTag) { throw "Tag '$version' already exists; refusing to retarget or overwrite it." }
            $publish = $true
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Package version: $version; publish release: $publish"

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyrapos-windows-release-build
          path: |
            release/lyrapos-*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  publish-windows-release:
    name: Verify and publish Windows GitHub Release
    needs: build-windows-release
    if: needs.build-windows-release.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: lyrapos-windows-release-build
          path: release

      - name: Create draft GitHub Release with Windows updater assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ needs.build-windows-release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: LyraPOS ${{ needs.build-windows-release.outputs.version }}
          draft: true
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release/lyrapos-*.exe
            release/latest.yml
            release/*.blockmap

      - name: Verify draft release and updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-windows-release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub releases, including drafts.' }
          $release = @($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG } | Select-Object -First 1)[0]
          if (-not $release) { throw "Draft release '$($env:RELEASE_TAG)' was not found in the repository release list." }
          if ($release.tag_name -ne $env:RELEASE_TAG) { throw 'Draft release tag mismatch.' }
          if (-not $release.draft -or $release.prerelease) { throw 'Expected an unpublished stable draft release.' }

          $assets = @($release.assets)
          $assetNames = @($assets | ForEach-Object { $_.name })
          $manifestAsset = $assets | Where-Object { $_.name -eq 'latest.yml' } | Select-Object -First 1
          if (-not $manifestAsset -or $manifestAsset.size -le 0) { throw 'Release is missing a non-empty latest.yml updater manifest.' }
          $installer = $assets | Where-Object { $_.name -match '^lyrapos-.*-win-x64\\.exe$' } | Select-Object -First 1
          if (-not $installer -or $installer.size -le 0) { throw 'Release is missing a non-empty x64 Windows installer.' }
          $blockmap = $assets | Where-Object { $_.name -eq ($installer.name + '.blockmap') } | Select-Object -First 1
          if (-not $blockmap -or $blockmap.size -le 0) { throw 'Release is missing the installer blockmap.' }

          $checkDir = Join-Path $env:RUNNER_TEMP 'lyrapos-release-verification'
          New-Item -ItemType Directory -Force -Path $checkDir | Out-Null
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/octet-stream'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $manifestPath = Join-Path $checkDir 'latest.yml'
          Invoke-WebRequest -Uri $manifestAsset.url -Headers $headers -OutFile $manifestPath
          $manifest = Get-Content $manifestPath -Raw
          $manifestVersion = [regex]::Match($manifest, '(?m)^version:\\s*["'']?([^""''\\s]+)').Groups[1].Value
          $manifestFile = [regex]::Match($manifest, '(?m)^\\s*-\\s*url:\\s*["'']?([^""''\\s]+)').Groups[1].Value
          $manifestHash = [regex]::Match($manifest, '(?m)^\\s*sha512:\\s*["'']?([^""''\\s]+)').Groups[1].Value
          if ($manifestVersion -ne $env:RELEASE_TAG) { throw "latest.yml version '$manifestVersion' does not match release tag '$($env:RELEASE_TAG)'." }
          if (-not $manifestFile -or $assetNames -notcontains $manifestFile) { throw "latest.yml references '$manifestFile', which is not attached to this release." }
          if (-not $manifestHash) { throw 'latest.yml is missing the SHA-512 checksum.' }
          if ($manifestFile -ne $installer.name) { throw 'latest.yml does not point to the expected x64 Windows installer.' }

          $installerAsset = $assets | Where-Object { $_.name -eq $manifestFile } | Select-Object -First 1
          $installerPath = Join-Path $checkDir $manifestFile
          Invoke-WebRequest -Uri $installerAsset.url -Headers $headers -OutFile $installerPath
          $sha = [System.Security.Cryptography.SHA512]::Create()
          try {
            $actualHash = [Convert]::ToBase64String($sha.ComputeHash([System.IO.File]::ReadAllBytes($installerPath)))
          } finally {
            $sha.Dispose()
          }
          if ($actualHash -ne $manifestHash) { throw 'Downloaded installer SHA-512 does not match latest.yml.' }
          Write-Host "Verified draft release assets and latest.yml for $($env:RELEASE_TAG)."

      - name: Publish verified Windows release as GitHub Latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-windows-release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not locate the verified draft release for publication.' }
          $release = @($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG } | Select-Object -First 1)[0]
          if (-not $release -or -not $release.draft -or $release.prerelease) {
            throw 'Refusing to publish: the matching release is missing, already published, or marked prerelease.'
          }
          gh api --method PATCH "repos/$env:GH_REPO/releases/$($release.id)" -F draft=false -F make_latest=true | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'GitHub rejected publication of the verified release.' }
          $latestTag = gh api "repos/$env:GH_REPO/releases/latest" --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or $latestTag.Trim() -ne $env:RELEASE_TAG) {
            throw "Published release did not become GitHub Latest (reported '$latestTag')."
          }
          Write-Host "Published LyraPOS $($env:RELEASE_TAG) and confirmed GitHub Latest."
