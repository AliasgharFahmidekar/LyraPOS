name: LyraPOS Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: lyrapos-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build LyraPOS Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run release:win

      - name: Verify release artifact names
        run: npm run verify:release-artifacts

      - name: Run Windows packaging identity guard
        run: npm run test:windows-packaging-identity

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lyrapos-windows
          path: |
            release/lyrapos-*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
