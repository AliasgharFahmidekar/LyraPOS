name: Bootstrap - Extract LyraPOS Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract uploaded source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="FloCafe-Bridge-main.zip"
          WORKDIR="${RUNNER_TEMP}/lyrapos-source"
          test -f "$ZIP"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          unzip -q "$ZIP" -d "$WORKDIR"
          shopt -s dotglob nullglob
          entries=("$WORKDIR"/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then SOURCE_DIR="${entries[0]}"; else SOURCE_DIR="$WORKDIR"; fi
          test -f "$SOURCE_DIR/package.json"
          rsync -a --delete --exclude '.git/' --exclude '.github/workflows/' "$SOURCE_DIR/" ./
          rm -f "$ZIP"
          test -f package.json
      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: extract LyraPOS source archive"
          git push origin HEAD:main
